[package]
name = "ram-optimizer"
version.workspace = true
edition.workspace = true

[dependencies]
ram-core = { path = "../core" }
# `unstable-winit-030` gives access to the native window for dragging the frameless window.
slint = { version = "1.18", features = ["unstable-winit-030"] }
# 0.24 shares Slint's muda version (two copies would clash on macOS).
tray-icon = "0.24"
# Auto-update: HTTPS downloads from GitHub Releases.
ureq = { version = "3", features = ["json"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
